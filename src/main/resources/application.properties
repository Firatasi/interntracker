 spring.application.name=interntracker
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.jpa.properties.hibernate.default_schema=interntracker
spring.datasource.username=postgres
spring.datasource.password=2002
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs
app.jwt.secret=interntracker-super-secret-key-64-chars-1234567890-abcdef
app.jwt.expiration-minutes=120
